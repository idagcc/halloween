name: Build Mac app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/check-source.py
      - run: bash -n scripts/build-mac.sh scripts/notarize-mac.sh
      - run: bash scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pumpkin-Pop-Mac
          path: dist/Pumpkin-Pop-Mac.zip
