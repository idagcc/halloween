#app:before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#020d26e8 0%,#03132abd 32%,#03132a08 69%),linear-gradient(0deg,#020b22cf,transparent 30%)}
#app:has(#game:not([hidden])):before{background:linear-gradient(180deg,#020b22d9,#020b2270 35%,#020b2299)}
.landscape,.texture,.hero-art,.stars{display:none}
.topbar{background:linear-gradient(#020a2280,transparent)}
.brand-sub,.offline,.description,.form-note,.steps,.text-button,.footer-note{color:#d0e5fc}
.brand-title{font-size:1.5cqw}.brand svg{filter:drop-shadow(0 0 10px #ff8b28)}
.icon-button{background:#071b3fcc;border-color:#a9d9ff35}
#home{padding:0 7cqw;grid-template-columns:1fr 1fr;inset:13% 0 9%}
.intro{padding:0}h1{font-size:5.6cqw;margin:.9cqw 0}h1 span{font-size:7.5cqw;color:#ffab35;text-shadow:0 0 3cqw #ff680055,0 .3cqw 0 #6e2519}
.eyebrow{color:#9de4ff}.tagline{margin:1.1cqw 0 .5cqw}.description{font-size:1cqw}
.join-card{background:#051b3cdb;backdrop-filter:blur(12px);border:1px solid #87cfff55;box-shadow:0 1cqw 4cqw #0006;width:29cqw;padding:1.3cqw}
.join-card label{color:#deefff;font-size:.65cqw}.input-wrap{background:#020e23aa;border-color:#79b8ee55}input{font-size:1.25cqw;padding:.8cqw}input::placeholder{color:#9eb9d3}
.play-button{color:#2f170a;background:linear-gradient(#ffc364,#ff8c25);box-shadow:0 .25cqw 0 #a34618,0 0 2cqw #ff8c2525}
.steps{font-size:.8cqw}.step-num{background:#0d2858;border-color:#78c8ff70;color:#dbf2ff}
.footer{background:linear-gradient(transparent,#020a22cc)}
.hud{background:#031632d9;border:1px solid #74bbf94d;border-radius:1.2cqw;padding:1cqw 1.5cqw;height:16%}
.field-hint{color:#fff4df;text-shadow:0 2px 5px #000;background:#031632d9;border:1px solid #74bbf94d;border-radius:3cqw;width:max-content;max-width:95%;margin:auto;padding:.6cqw 1.2cqw}
.target{filter:drop-shadow(0 0 1.1cqw #ff7a17) drop-shadow(0 .5cqw .5cqw #000)}
.target.golden{filter:drop-shadow(0 0 1.4cqw #ffe64b)}.target .life-ring{border:2px solid #ffdb8999;box-shadow:0 0 1cqw #ff92284d}
.overlay{background:#020e267d;backdrop-filter:blur(7px)}.modal{background:linear-gradient(140deg,#0b3155f5,#06142ef5);border-color:#80cfff66;box-shadow:0 1cqw 7cqw #0008}.modal .sub{color:#bfd9f0}.settings-row select{background:#06162f}.settings-row small,.hardware-note{color:#b8cde3}
.result-modal{width:76cqw;display:grid;grid-template-columns:1fr 1fr;gap:3cqw;padding:2.4cqw 3cqw;overflow:auto}
.result-summary{align-self:center}.result-summary .modal-hero{width:5cqw;height:5cqw}.result-summary h2{font-size:2.6cqw}.result-summary .sub{margin-bottom:.7cqw}.result-score{font-size:5cqw}.score-label{margin-bottom:.8cqw}.result-stats{margin:1cqw 0;gap:2cqw}.result-stats small{color:#bfd9f0}
.result-board{border-left:1px solid #8dcfff30;padding-left:3cqw;align-self:center;text-align:left}.result-board h3{font-size:2cqw;margin:.5cqw 0}.result-board .eyebrow{justify-content:flex-start}.result-board .sub{font-size:.85cqw}.leader-list{margin:1.2cqw 0}.leader-list li{background:#ffffff08;padding:.85cqw;font-size:1.1cqw}.leader-list li.current-player{background:#8edbff20;border:1px solid #8edbff80}.leader-player small{color:#9de4ff;font-size:.65cqw;margin-left:.5cqw}.leader-player{white-space:nowrap}.rank{color:#a9d4f7}.rank-note{color:#bad7ef;font-size:.8cqw;line-height:1.5}.record-tag{color:#ffcd75;background:#ffb23f15;border-color:#ffb23f55}


.target.ghost-target{filter:drop-shadow(0 0 1.4cqw #a6e4ff) drop-shadow(0 .5cqw .5cqw #000)}.target.ghost-target .life-ring{border-color:#d4f4ff99;box-shadow:0 0 1cqw #8bdcff55}

/* Keep the event screen focused on play. */
.topbar{justify-content:flex-end;background:none}.join-card{margin-top:2cqw}.footer{justify-content:flex-end;gap:.8cqw;background:none}.settings-row small{display:none}
/* Touchscreen overlays may report mouse input, so hide every cursor during rounds. */
html.game-active,html.game-active *{cursor:none!important}
</style>

<script>
'use strict';
(() => {
 const $ = id => document.getElementById(id);
 const defaults = {duration:60,size:'big',pace:'gentle',reach:'all',sound:true,music:'soft'};
 const read = (key,fallback) => {try{return JSON.parse(localStorage.getItem(key)) ?? fallback}catch{return fallback}};
 const write = (key,value) => {try{localStorage.setItem(key,JSON.stringify(value))}catch{}};
 const saved = read('pumpkin-pop-settings',{});
 const settings = {...defaults,...(saved && typeof saved === 'object' ? saved : {})};
 settings.duration=60;
 for (const [key,values] of Object.entries({size:['big','extra'],pace:['gentle','speedy'],reach:['all','lower']})) if(!values.includes(settings[key])) settings[key]=defaults[key];
 settings.sound=settings.sound!==false;
 if(!['off','soft','normal'].includes(settings.music))settings.music='soft';
 let records = read('pumpkin-pop-records',[]);
 records = Array.isArray(records) ? records.filter(r=>r && typeof r.name==='string' && Number.isFinite(r.score) && r.score>=0 && [30,45,60].includes(r.duration)).slice(0,50) : [];
 let phase='home', player='', score=0,hits=0,golds=0,bestStreak=0,streak=0,lastHit=0,elapsed=0,lastFrame=0,nextSpawn=0,frame=0,countTimer=0;
 let targets=[], audioCtx,previousFocus,modalKind='',countValue=3,countContinuation,toastTimer;
 function setPhase(value){phase=value;document.documentElement.classList.toggle('game-active',value==='playing'||value==='countdown');syncMusic()}
 const svg = (id,cls='') => `<svg class="${cls}" viewBox="0 0 ${id==='ghost'?'180 200':'300 300'}" aria-hidden="true"><use href="#${id}"/></svg>`;
 const escapeHTML = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function initStars(){let seed=216;const random=()=>{seed=(seed*9301+49297)%233280;return seed/233280};for(let i=0;i<58;i++){const star=document.createElement('i');star.className='star';let size=random()*2+1;star.style.cssText=`left:${random()*100}%;top:${random()*90}%;width:${size}px;height:${size}px;animation-delay:-${random()*5}s`;document.querySelector('.stars').append(star)}}
 function syncSettings(){write('pumpkin-pop-settings',settings);syncMusic()}
 function unlockAudio(){try{if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();audioCtx.onstatechange=syncMusic}if(audioCtx.state==='suspended')audioCtx.resume().then(syncMusic).catch(()=>{});else syncMusic()}catch{}}
 // Original minor-key music, synthesized locally so the game stays fully offline.
 let musicTimer=0,musicNext=0,musicStep=0;
 const musicNodes=new Set();
 const musicMelody=[69,null,72,76,75,null,72,null,68,null,71,74,72,null,71,null,69,null,72,76,81,null,79,76,75,null,72,71,68,null,71,null];
 function musicNote(midi,time,length,volume,type='sine'){
  const oscillator=audioCtx.createOscillator(),gain=audioCtx.createGain();
  oscillator.type=type;oscillator.frequency.value=440*Math.pow(2,(midi-69)/12);
  gain.gain.setValueAtTime(0,time);gain.gain.linearRampToValueAtTime(volume,time+.025);gain.gain.exponentialRampToValueAtTime(.0001,time+length);
  oscillator.connect(gain);gain.connect(audioCtx.destination);musicNodes.add(oscillator);
  oscillator.onended=()=>{musicNodes.delete(oscillator);oscillator.disconnect();gain.disconnect()};
  oscillator.start(time);oscillator.stop(time+length+.03);
 }
 function stopMusic(){clearInterval(musicTimer);musicTimer=0;for(const node of musicNodes){try{node.stop()}catch{}}musicNodes.clear()}
 function syncMusic(){
  if(!audioCtx||audioCtx.state!=='running'||!settings.sound||settings.music==='off'){stopMusic();return}
  if(musicTimer)return;
  musicStep=0;musicNext=audioCtx.currentTime+.04;
  const schedule=()=>{
   if(musicNext<audioCtx.currentTime)musicNext=audioCtx.currentTime+.04;
   while(musicNext<audioCtx.currentTime+.25){
    const step=musicStep%32,level=settings.music==='normal'?.05:.025,note=musicMelody[step];
    if(note!==null){musicNote(note,musicNext,.65,level);musicNote(note+12,musicNext,.35,level*.18)}
    if(step%8===0)musicNote([45,44,45,40][step/8],musicNext,2.6,level*.65,'triangle');
    musicStep++;musicNext+=.36;
   }
  };
  schedule();musicTimer=setInterval(schedule,100);
 }
 function tone(freq,duration=.12,type='sine',volume=.08,delay=0){if(!settings.sound||!audioCtx||audioCtx.state!=='running')return;try{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*.65,t+duration);g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02)}catch{}}
 function popSound(golden){tone(golden?880:380,.13,'sine',.17);tone(golden?1320:690,.18,'triangle',.06,.025);if(golden)tone(1760,.25,'sine',.07,.09)}
 function celebrate(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.09,i*.12))}
 function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
 function backgroundInert(value){for(const el of [$('home'),$('home-footer'),$('game'),document.querySelector('.topbar')])el.inert=value}
 function showModal(content,kind){previousFocus=document.activeElement;backgroundInert(true);modalKind=kind;$('overlay').innerHTML=content;$('overlay').hidden=false;const modal=$('overlay').querySelector('[role="dialog"]');if(modal){modal.setAttribute('aria-modal','true');modal.tabIndex=-1}requestAnimationFrame(() => ($('overlay').querySelector('[autofocus]')||$('overlay').querySelector('button,select,input')||modal)?.focus())}
 function hideModal(restore=true){backgroundInert(false);$('overlay').hidden=true;$('overlay').innerHTML='';modalKind='';if(restore && previousFocus?.isConnected)previousFocus.focus()}
 const closeBtn='<button class="icon-button close" data-action="close" aria-label="Close">×</button>';
 function openAdmin(){
  if(phase==='playing'||phase==='countdown')pauseGame();
  showModal(`<section class="modal" role="dialog" aria-labelledby="admin-title">${closeBtn}<h2 id="admin-title">Admin</h2><button class="play-button" data-action="admin-leaders">Leaderboard</button><button class="secondary-button" data-action="export-leaders" ${records.length?'':'disabled'}>Export leaderboard (CSV)</button><button class="secondary-button" data-action="admin-settings">Settings &amp; music</button><button class="secondary-button" data-action="clear-leaders" ${records.length?'':'disabled'}>Clear leaderboard</button><button class="secondary-button" data-action="close">Done</button></section>`,'admin');
 }
 function openSettings(){showModal(`<section class="modal" role="dialog" aria-labelledby="settings-title">${closeBtn}<h2 id="settings-title">Settings</h2><div class="settings-row"><label for="duration">Round length<small>A quick turn for every child</small></label><select id="duration" disabled><option value="60">60 seconds</option></select></div><div class="settings-row"><label for="size">Pumpkin size<small>Generous targets for little hands</small></label><select id="size"><option value="big">Big</option><option value="extra">Extra big</option></select></div><div class="settings-row"><label for="pace">Game pace<small>How quickly pumpkins disappear</small></label><select id="pace"><option value="gentle">Gentle</option><option value="speedy">Speedy</option></select></div><div class="settings-row"><label for="reach">Play area<small>Keep targets within easy reach</small></label><select id="reach"><option value="all">Whole play area</option><option value="lower">Lower half only</option></select></div><div class="settings-row"><label for="sound">Game audio</label><select id="sound"><option value="on">On</option><option value="off">Muted</option></select></div><div class="settings-row"><label for="music">Halloween music</label><select id="music"><option value="off">Off</option><option value="soft">Soft</option><option value="normal">Normal</option></select></div><button class="play-button" data-action="save-settings">Done</button></section>`,'settings');for(const key of ['duration','size','pace','reach','music'])$(key).value=String(settings[key]);$('sound').value=settings.sound?'on':'off'}
 function openLeaders(){const ranked=records.filter(r=>r.duration===settings.duration).sort((a,b)=>b.score-a.score).slice(0,5);showModal(`<section class="modal" role="dialog" aria-labelledby="leaders-title">${closeBtn}<h2 id="leaders-title">Leaderboard</h2>${ranked.length?`<ol class="leader-list">${ranked.map((r,i)=>`<li><span class="rank">${i===0?'★':String(i+1).padStart(2,'0')}</span><span class="leader-player">${escapeHTML(r.name)}</span><strong class="leader-points">${r.score}</strong></li>`).join('')}</ol>`:`${svg('pumpkin','modal-hero')}<p class="sub">No scores yet</p>`}<button class="play-button" data-action="close">Done</button><button class="secondary-button" data-action="export-leaders" ${records.length?'':'disabled'}>Export leaderboard (CSV)</button>${records.length?'<button class="secondary-button" data-action="clear-leaders">Clear leaderboard</button>':''}</section>`,'leaders')}
 function leaderboardCSV(){
  const cell=value=>{let text=String(value??'');if(/^[=+\-@\t\r\n]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"'};
  const rows=[['Rank','Player name','Score','Round length (seconds)','Date (UTC)'],...records.slice().sort((a,b)=>b.score-a.score).map((r,i)=>[i+1,r.name,r.score,r.duration,r.date||''])];
  return '\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n')+'\r\n';
 }
 function exportLeaders(){
  if(!records.length){toast('No scores to export yet');return}
  const csv=leaderboardCSV();
  if(window.pumpkinNative?.exportLeaderboard){window.pumpkinNative.exportLeaderboard(csv);return}
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');
  link.href=url;link.download='Pumpkin-Pop-Leaderboard-'+new Date().toISOString().slice(0,10)+'.csv';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
 }
 document.addEventListener('pumpkinexportresult',e=>{if(e.detail==='saved')toast('Leaderboard exported');if(e.detail==='error')toast('Could not save the export. Please try again.')});
 function confirmClearLeaders(){showModal(`<section class="modal" role="dialog" aria-labelledby="clear-title"><h2 id="clear-title">Clear leaderboard?</h2><p class="sub">This deletes all saved scores on this device. You cannot undo this.</p><button class="play-button" data-action="cancel-clear" autofocus>Keep scores</button><button class="secondary-button" data-action="confirm-clear">Delete all scores</button></section>`,'clear-leaders')}
 function openKeyboard(){showModal(`<section class="modal keyboard" role="dialog" aria-labelledby="keyboard-title">${closeBtn}<h2 id="keyboard-title">Your name</h2><div class="keyboard-preview" id="keyboard-preview"></div>${['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].map(row=>`<div class="keyboard-row">${[...row].map(k=>`<button class="keyboard-key" data-key="${k}">${k}</button>`).join('')}</div>`).join('')}<div class="keyboard-row"><button class="keyboard-key wide" data-key="clear">Clear</button><button class="keyboard-key key-space" data-key=" ">Space</button><button class="keyboard-key wide" data-key="back" aria-label="Backspace">⌫</button></div><button class="play-button" data-action="keyboard-play">Play ▸</button></section>`,'keyboard');updateKeyboard()}
 function updateKeyboard(){$('keyboard-preview').textContent=$('player-input').value||'Your name';$('overlay').querySelector('[data-action="keyboard-play"]').disabled=!$('player-input').value.trim()}
 function resetField(){cancelAnimationFrame(frame);clearTimeout(countTimer);targets.forEach(t=>t.el.remove());targets=[];$('playfield').querySelectorAll('.points,.particle,.ripple').forEach(el=>el.remove());$('combo').textContent=''}
 function startGame(){let name=$('player-input').value.trim().split(/\s+/u)[0].slice(0,18);if(!name){$('player-input').focus();toast('Add your name to join the patch!');return}$('player-input').value=name;unlockAudio();player=name;resetField();hideModal(false);score=0;hits=0;golds=0;bestStreak=0;streak=0;lastHit=-10000;elapsed=0;nextSpawn=0;$('home').hidden=true;$('home-footer').hidden=true;$('game').hidden=false;$('player-name').textContent=player;$('score').textContent='0';$('time-left').textContent=settings.duration;$('time-progress').style.width='100%';$('timer-box').classList.remove('urgent');countdown(()=>{setPhase('playing');lastFrame=performance.now();frame=requestAnimationFrame(tick);$('pause-button').focus()})}
 function countdown(done){setPhase('countdown');countValue=3;countContinuation=done;showModal(`<div style="text-align:center" role="dialog" aria-label="Get ready"><div class="count-sub">Get ready, ${escapeHTML(player)}!</div><div class="countdown countdown-bounce" id="count-number">3</div></div>`,'countdown');tone(440);const step=()=>{countValue--;if(countValue>0){$('count-number').textContent=countValue;$('count-number').classList.remove('countdown-bounce');void $('count-number').offsetWidth;$('count-number').classList.add('countdown-bounce');tone(440);countTimer=setTimeout(step,800)}else{tone(880,.2);hideModal(false);done()}};countTimer=setTimeout(step,800)}
 function dimensions(){const rect=$('playfield').getBoundingClientRect();const size=Math.min(rect.width*.23,rect.height*.41,Math.max(rect.width*.145,150))*(settings.size==='extra'?1.22:1);return {width:rect.width,height:rect.height,size:Math.min(size,rect.height*.45,rect.width*.43)}}
 function spawn(){const {width,height,size}=dimensions();const minY=settings.reach==='lower'?height*.5:Math.min(35,height*.08);const maxY=height-size-15;const minX=12,maxX=width-size-12;if(maxY<minY||maxX<minX)return false;let x,y,valid=false;for(let i=0;i<35;i++){x=minX+Math.random()*(maxX-minX);y=minY+Math.random()*(maxY-minY);if(targets.every(t=>Math.hypot(x+size/2-(t.x+t.size/2),y+size/2-(t.y+t.size/2))>(size+t.size)*.46)){valid=true;break}}if(!valid)return false;const roll=Math.random(),golden=roll<.14,kind=golden?'golden-pumpkin':roll<.57?'ghost':'pumpkin';const life=settings.pace==='gentle'?3300-Math.min(elapsed*.014,600):2100-Math.min(elapsed*.012,500);const el=document.createElement('button');el.className='target'+(golden?' golden':kind==='ghost'?' ghost-target':'');el.setAttribute('aria-label',golden?'Golden pumpkin, 30 points':kind==='ghost'?'Ghost, 10 points':'Pumpkin, 10 points');el.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;--life:${life}ms`;el.innerHTML=svg(kind)+'<span class="life-ring"></span>';const target={el,x,y,size,golden,kind,expires:elapsed+life,popped:false};el.addEventListener('pointerdown',e=>{e.preventDefault();popTarget(target,e.clientX,e.clientY)});el.addEventListener('click',e=>{if(e.detail===0)popTarget(target)});$('playfield').append(el);targets.push(target);return true}
 function popTarget(target,clientX,clientY){if(phase!=='playing'||target.popped||elapsed>=target.expires)return;target.popped=true;const now=elapsed;streak=now-lastHit<1800?streak+1:1;lastHit=now;bestStreak=Math.max(bestStreak,streak);hits++;if(target.golden)golds++;const points=target.golden?30:10;score+=points;$('score').textContent=score;targets=targets.filter(t=>t!==target);target.el.classList.add('popped');setTimeout(()=>target.el.remove(),200);const rect=$('playfield').getBoundingClientRect();const x=clientX===undefined?target.x+target.size/2:clientX-rect.left,y=clientY===undefined?target.y+target.size/2:clientY-rect.top;effect(x,y,target.golden?'+30 ✦':'+10',target.golden,target.kind==='ghost');popSound(target.golden);if(streak>=3){$('combo').textContent=streak>=10?`${streak} in a row! Pumpkin superstar!`:`${streak} in a row! Spook-tacular!`}nextSpawn=Math.min(nextSpawn,elapsed+150)}
 function effect(x,y,label,golden,ghost=false){const field=$('playfield');const pts=document.createElement('div');pts.className='points';pts.textContent=label;pts.style.cssText=`left:${x}px;top:${y}px`;field.append(pts);setTimeout(()=>pts.remove(),1000);for(let i=0;i<12;i++){const p=document.createElement('i'),angle=i/12*Math.PI*2,dist=45+Math.random()*70;p.className='particle';p.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px;--particle:${(ghost?['#ffffff','#a6e4ff','#7fc5ff','#d9f7ff']:['#ffb140','#ffdb7a','#bfa2e3','#d7f38a'])[i%4]}`;field.append(p);setTimeout(()=>p.remove(),700)}if(golden){const ring=document.createElement('i');ring.className='ripple';ring.style.cssText=`left:${x}px;top:${y}px`;field.append(ring);setTimeout(()=>ring.remove(),600)}}
 function tick(now){if(phase!=='playing')return;const delta=Math.max(0,now-lastFrame);lastFrame=now;elapsed+=delta;const left=Math.max(0,settings.duration*1000-elapsed);$('time-left').textContent=Math.ceil(left/1000);$('time-progress').style.width=`${left/(settings.duration*10)}%`;$('timer-box').classList.toggle('urgent',left<=10000);if(!left){finishGame();return}targets=targets.filter(t=>{if(elapsed>=t.expires){t.el.remove();return false}return true});if(elapsed>=nextSpawn){if(targets.length<(settings.pace==='gentle'?3:4))spawn();nextSpawn=elapsed+(settings.pace==='gentle'?800:530)}if(elapsed-lastHit>1800){streak=0;$('combo').textContent=''}frame=requestAnimationFrame(tick)}
 function pauseGame(){if(phase==='countdown'){clearTimeout(countTimer);setPhase('paused-countdown')}else if(phase==='playing'){setPhase('paused');cancelAnimationFrame(frame);targets.forEach(t=>{t.el.style.animationPlayState='paused';t.el.querySelector('.life-ring').style.animationPlayState='paused'})}else return;pauseMenu()}
 function pauseMenu(){showModal(`<section class="modal" role="dialog" aria-labelledby="pause-title">${svg('ghost','modal-hero')}<h2 id="pause-title">Paused</h2><button class="play-button" data-action="resume" autofocus>Resume ▸</button><button class="secondary-button" data-action="home">Home</button></section>`,'pause')}
 function resumeGame(){unlockAudio();const wasCountdown=phase==='paused-countdown';hideModal(false);if(wasCountdown){countdown(countContinuation);return}setPhase('playing');lastFrame=performance.now();targets.forEach(t=>{t.el.style.animationPlayState='running';t.el.querySelector('.life-ring').style.animationPlayState='running'});frame=requestAnimationFrame(tick);$('pause-button').focus()}
 function finishGame(){
  setPhase('result');resetField();
  const previous=records.filter(r=>r.duration===60).reduce((max,r)=>Math.max(max,r.score),0),record=score>previous;
  const entry={name:player,score,duration:60,date:new Date().toISOString()};
  records.push(entry);records.sort((a,b)=>b.score-a.score);
  const ranked=records.filter(r=>r.duration===60),rank=ranked.indexOf(entry)+1;
  records=records.slice(0,50);write('pumpkin-pop-records',records);celebrate();
  $('announcer').textContent=`Great job, ${player}! You scored ${score} points. Leaderboard rank ${rank}.`;
  const row=(r,i)=>`<li class="${r===entry?'current-player':''}"><span class="rank">${i===0?'★':String(i+1).padStart(2,'0')}</span><span class="leader-player">${escapeHTML(r.name)}${r===entry?'<small>YOU</small>':''}</span><strong class="leader-points">${r.score}</strong></li>`;
  showModal(`<section class="modal result-modal" role="dialog" aria-labelledby="result-title"><div class="result-summary">${svg('pumpkin','modal-hero')}<h2 id="result-title">Time’s up, ${escapeHTML(player)}!</h2>${record?'<div class="record-tag">★ New high score!</div>':''}<div class="result-score">${score}</div><div class="score-label">POINTS</div><div class="result-stats"><div><strong>${hits}</strong><small>targets popped</small></div><div><strong>${golds}</strong><small>golden pumpkins</small></div><div><strong>${bestStreak}</strong><small>best streak</small></div></div><button class="play-button" data-action="replay" autofocus>Play again ▸</button><button class="secondary-button" data-action="next-player">Next player →</button></div><div class="result-board"><h3>Leaderboard</h3><ol class="leader-list">${ranked.slice(0,5).map(row).join('')}</ol>${rank>5?`<ol class="leader-list" start="${rank}">${row(entry,rank-1)}</ol>`:''}<p class="rank-note">Your rank: #${rank}</p></div></section>`,'result');
 }
 function home(next=false){setPhase('home');resetField();hideModal(false);$('home').hidden=false;$('home-footer').hidden=false;$('game').hidden=true;if(next)$('player-input').value='';$('player-input').focus()}
 $('join-form').addEventListener('submit',e=>{e.preventDefault();startGame()});$('settings-open').addEventListener('click',openSettings);$('leaders-open').addEventListener('click',openLeaders);$('keyboard-open').addEventListener('click',openKeyboard);$('pause-button').addEventListener('click',pauseGame);
 $('overlay').addEventListener('click',e=>{const key=e.target.closest('[data-key]')?.dataset.key;if(key!==undefined){const input=$('player-input');if(key==='clear')input.value='';else if(key==='back')input.value=[...input.value].slice(0,-1).join('');else if(input.value.length<18)input.value+=input.value.trim()?key.toLowerCase():key;updateKeyboard();return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='admin-leaders')openLeaders();if(action==='admin-settings')openSettings();if(action==='export-leaders')exportLeaders();if(action==='clear-leaders')confirmClearLeaders();if(action==='cancel-clear')openLeaders();if(action==='confirm-clear'){try{localStorage.removeItem('pumpkin-pop-records');records=[];openLeaders();toast('Leaderboard cleared')}catch{toast('Scores could not be cleared. Please try again.')}}if(action==='close'){hideModal();if(['paused','paused-countdown'].includes(phase))pauseMenu()}if(action==='save-settings'){for(const key of ['size','pace','reach','music'])settings[key]=$(key).value;settings.duration=60;settings.sound=$('sound').value==='on';syncSettings();hideModal();if(['paused','paused-countdown'].includes(phase))pauseMenu()}if(action==='keyboard-play'||action==='replay')startGame();if(action==='resume')resumeGame();if(action==='home')home();if(action==='next-player')home(true)});
 $('overlay').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const items=[...$('overlay').querySelectorAll('button:not(:disabled),input,select,[tabindex="0"]')];if(!items.length){e.preventDefault();return}const first=items[0],last=items.at(-1);if(e.shiftKey && (document.activeElement===first || !$('overlay').contains(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus()}});
 document.addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();openAdmin();return}if(e.key==='Escape'){if(phase==='playing'||phase==='countdown')pauseGame();else if(phase==='paused'||phase==='paused-countdown')resumeGame();else if(['admin','settings','leaders','keyboard','clear-leaders'].includes(modalKind)){hideModal();if(['paused','paused-countdown'].includes(phase))pauseMenu()}}if(modalKind==='keyboard'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){if(e.key==='Backspace'){e.preventDefault();$('player-input').value=[...$('player-input').value].slice(0,-1).join('');updateKeyboard()}else if(e.key.length===1&&/^[\p{L} '-]$/u.test(e.key)&&$('player-input').value.length<18){e.preventDefault();$('player-input').value+=e.key;updateKeyboard()}}});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});window.addEventListener('blur',pauseGame);window.addEventListener('resize',()=>{if(['playing','paused'].includes(phase)){targets.forEach(t=>t.el.remove());targets=[];nextSpawn=elapsed+200}});
 // Browsers may require the first tap or key press before allowing audio.
 document.addEventListener('pointerdown',unlockAudio,{capture:true});
 document.addEventListener('keydown',unlockAudio,{capture:true});
 initStars();syncSettings();unlockAudio();
})();
</script>
